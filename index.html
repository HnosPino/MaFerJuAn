<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#003a8c">
<meta name="description" content="Mi fútbol: entrenamiento libre de fútbol para niños, adolescentes y jóvenes de 5 a 20 años.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi fútbol</title>
<style>
:root{
--bg:#001533; --bg2:#00214d; --card:#062b63; --card2:#0b3a80; --line:#1d4f9c;
--tx:#f3f6ff; --tx2:#aebfdf; --acc:#ffc414; --acc2:#ffdf5e; --warn:#ff7a59; --blue:#6fb7ff;
--gold:#ffc414; --navy:#002a6b;
--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:84px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h1{font-size:24px} h2{font-size:19px} h3{font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{position:relative;background:linear-gradient(180deg,#003a8c 0%,#003a8c 38%,var(--gold) 38%,var(--gold) 58%,#003a8c 58%,#001f4d 100%);padding:20px 16px 18px;overflow:hidden}
.top .wrap{position:relative;z-index:1}
.top h1,.top .sub,.top .brand{text-shadow:0 1px 3px rgba(0,20,60,.8)}
.top h1{background:rgba(0,30,80,.55);display:inline-block;padding:2px 10px;border-radius:10px}
.top .sub{background:rgba(0,30,80,.55);display:inline-block;padding:2px 10px;border-radius:8px;color:#fff}
.top .wrap{padding:0 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.brand .ball{width:34px;height:34px}
.sub{color:var(--tx2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--r);padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--tx2);font-size:12px;margin:2px 4px 2px 0}
.pill.acc{background:rgba(61,220,132,.15);color:var(--acc)}
.pill.y{background:rgba(255,210,63,.15);color:var(--acc2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--acc);color:#00214d;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,42,107,.25)}
.btn.full{width:100%}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.warn{background:var(--warn);color:#2a0a00}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;color:var(--tx2);font-weight:600;font-size:14px}
.seg button.on{background:var(--acc);color:#00214d}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;margin-top:2px}
.chk.on{background:var(--acc);border-color:var(--acc);color:#00214d;font-weight:900}
.ex .nm{font-weight:650}
.ex.done .nm{text-decoration:line-through;color:var(--tx2)}
.ex .meta{font-size:13px;color:var(--tx2)}
.play{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.c-cal{color:#ffb35c}.c-tec{color:var(--acc)}.c-fue{color:#ff7a9c}.c-vel{color:var(--acc2)}.c-res{color:var(--blue)}.c-vc{color:#c49bff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--tx2)}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.bar.y i{background:var(--acc2)} .bar.b i{background:var(--blue)}
.week{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:8px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week .col{width:100%;background:var(--acc);border-radius:6px 6px 3px 3px;min-height:3px}
.week .col.empty{background:var(--line)}
.week small{font-size:11px;color:var(--tx2)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat div{aspect-ratio:1;border-radius:6px;background:var(--bg2);border:1px solid var(--line);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.heat .l1{background:#2b5fb0}.heat .l2{background:#c9a21a;color:#00214d}.heat .l3{background:var(--acc);color:#00214d;font-weight:700}
.heat .today{outline:2px solid var(--acc2)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#001233;border-top:3px solid var(--gold);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx2);padding:6px 0}
.nav button.on{color:var(--acc)}
.nav svg{width:24px;height:24px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.month{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin:8px 0}
.month .n{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--card2);flex:none}
.month.ok .n{background:var(--acc);color:#00214d}
.month.now{border-color:var(--acc2)}
.month.now .n{background:var(--acc2);color:#2a2000}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{text-align:center;padding:10px 6px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--tx2);opacity:.45}
.badge.on{opacity:1;color:var(--tx);border-color:var(--acc2)}
.badge .e{font-size:28px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.chips input{width:auto;margin:0;accent-color:var(--acc)}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px}
.overlay{position:fixed;inset:0;background:#001233;z-index:10;display:none;overflow:auto}
.overlay.show{display:block}
.player{max-width:520px;margin:0 auto;padding:20px 18px 40px;text-align:center;min-height:100%;display:flex;flex-direction:column}
.big{font-size:84px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px;margin:10px 0}
.phase{display:inline-block;padding:6px 16px;border-radius:999px;font-weight:800;letter-spacing:1px;font-size:14px}
.phase.w{background:var(--acc);color:#00214d}.phase.r{background:var(--blue);color:#032033}.phase.p{background:var(--acc2);color:#2a2000}
.ctrls{display:flex;gap:10px;justify-content:center;margin-top:auto;padding-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--acc2);color:#2a2000;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;display:none;max-width:90%;text-align:center}
.muted{color:var(--tx2);font-size:14px}
.tip{font-size:13px;color:var(--tx2);background:var(--bg2);border-left:3px solid var(--acc2);padding:8px 10px;border-radius:8px;margin-top:8px}
.list-plain{padding-left:18px;margin:6px 0;color:var(--tx2);font-size:14px}
.list-plain li{margin:4px 0}
.hero-ball{width:120px;height:120px;margin:10px auto 6px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:15;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
textarea{width:100%;min-height:110px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,monospace}
.testrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:8px}
.testrow:first-child{border-top:0}
.vid{background:linear-gradient(180deg,#0a3c86,#001f4d);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.fig .gr{fill:#000;opacity:.4}
.fig line{stroke-linecap:round}
.fig .th{stroke:#c98f62;stroke-width:5.5}
.fig .sh{stroke:#002a6b;stroke-width:8.5}
.fig .so{stroke:#0b4bb3;stroke-width:5}
.fig .bt{fill:#111}
.fig .ua{stroke:#c98f62;stroke-width:4.3}
.fig .sl{stroke:#0b4bb3;stroke-width:6.2}
.fig .fa{stroke:#c98f62;stroke-width:4.1}
.fig .hn{fill:#c98f62}
.fig .nk{stroke:#c98f62;stroke-width:4.5}
.fig .tor{stroke:#0b4bb3;stroke-width:13}
.fig .num{stroke:#ffc414;stroke-width:13;stroke-linecap:butt}
.fig .hair{fill:#2b1a10}
.fig .face{fill:#d9a072}
.fig .eye{fill:#2b1a10}
.fig .back{filter:brightness(.7)}
.fig .bl{fill:#fff;stroke:#111;stroke-width:1.2;stroke-dasharray:2.2 1.4}
.fig .fx{fill:none;stroke:#5ec8ff;stroke-width:2}
.fig .bd{stroke:#ff7a9c;stroke-width:2;stroke-dasharray:3 2}
.thumb{flex:none;border-radius:10px;background:#00214d;border:1px solid var(--line)}
.up{color:var(--acc);font-weight:700}.down{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" style="display:none"></nav>
<div class="overlay" id="ov"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const BALL = `<svg viewBox="0 0 64 64" class="ball" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#fff"/><path d="M32 18l9 6.5-3.4 10.6H26.4L23 24.5z" fill="#0a1f17"/><path d="M32 2v16M41 24.5l14-5M37.6 35.1l9 12M26.4 35.1l-9 12M23 24.5l-14-5" stroke="#0a1f17" stroke-width="2.5" fill="none"/><path d="M47 47l6 7M17 47l-6 7M55 19.5l6-2M9 19.5l-6-2" stroke="#0a1f17" stroke-width="2"/><circle cx="32" cy="32" r="30" fill="none" stroke="#0a1f17" stroke-width="2"/></svg>`;
const GROUPS = [
{id:1,min:5,max:7,  name:"Iniciación (5-7)",  spw:3,mins:20,f:.9,
focus:"Diversión, coordinación y mucho balón. Juegos cortos, sin pesas.",
notes:["Sesiones cortas tipo juego; siempre con un adulto cerca.","Nada de pesas: el propio cuerpo es suficiente.","Sin cabeceo."]},
{id:2,min:8,max:10, name:"Fundamentos (8-10)",spw:3,mins:35,f:.95,
focus:"Técnica con ambas piernas, agilidad y velocidad de reacción.",
notes:["Etapa clave para técnica y coordinación.","Fuerza solo con peso corporal y juegos.","Sin cabeceo en el entrenamiento."]},
{id:3,min:11,max:13,name:"Aprender a entrenar (11-13)",spw:4,mins:45,f:1,
focus:"Técnica avanzada, fuerza con peso corporal y bandas, prevención de lesiones.",
notes:["Fuerza con bandas y peso corporal, cuidando la técnica.","Cabeceo muy limitado y con balón ligero.","Respeta el crecimiento: si algo duele, para."]},
{id:4,min:14,max:16,name:"Entrenar para competir (14-16)",spw:4,mins:55,f:1.15,
focus:"Fuerza con cargas ligeras, potencia, resistencia y técnica a velocidad.",
notes:["Pesas ligeras con técnica perfecta antes de subir carga.","Incluye nórdicos y Copenhague (prevención).","Duerme 8-10 h: el descanso también entrena."]},
{id:5,min:17,max:20,name:"Alto rendimiento (17-20)",spw:5,mins:65,f:1.3,
focus:"Fuerza y potencia con pesas, velocidad máxima, resistencia específica.",
notes:["Progresión de cargas semana a semana.","Alterna días intensos y suaves.","Nutrición e hidratación al nivel del entrenamiento."]}
];
const groupOf = a => GROUPS.find(g=>a>=g.min&&a<=g.max) || GROUPS[2];
const WU={bal:"Técnica y manejo de balón",equ:"Equilibrio",fue:"Fuerza de activación",agi:"Agilidad"};
const CATS = {cal:"Calentamiento",tec:"Técnica con balón",fue:"Fuerza",vel:"Velocidad y agilidad",res:"Resistencia",vc:"Vuelta a la calma"};
const EQUIP = {cuerpo:"Peso corporal",balon:"Balón",alfombra:"Alfombra/esterilla",bandas:"Bandas elásticas",pesas:"Pesas/mancuernas",bicicleta:"Bicicleta",atletismo:"Pista/espacio para correr",cuerda:"Cuerda de saltar",conos:"Conos o botellas"};
const EX = [
// CALENTAMIENTO
{id:"c1",c:"cal",w:"agi",n:"Trote suave",e:"ca",q:["cuerpo"],a:[5,20],t:120,s:1,d:"Trota suave en el sitio o alrededor del espacio. Respira por la nariz y ve subiendo el ritmo poco a poco."},
{id:"c2",c:"cal",w:"agi",n:"Movilidad articular",e:"ca",q:["cuerpo"],a:[5,20],t:90,s:1,d:"Círculos de tobillos, rodillas, cadera, hombros y cuello. 10 de cada uno hacia cada lado."},
{id:"c3",c:"cal",w:"agi",n:"Saltos de tijera",e:"ca",q:["cuerpo"],a:[5,20],t:40,s:1,d:"Abre y cierra piernas y brazos a la vez, aterrizando suave sobre la punta de los pies."},
{id:"c4",c:"cal",w:"bal",n:"Semáforo con balón",e:"ca",q:["balon"],a:[5,9],t:120,s:1,d:"Conduce el balón. Verde = rápido, amarillo = despacio, rojo = pisa el balón y para. Un adulto dice los colores."},
{id:"c5",c:"cal",w:"agi",n:"Skipping y talones al glúteo",e:"ca",q:["cuerpo"],a:[8,20],t:60,s:1,d:"30 s rodillas arriba con brazos activos y 30 s talones a los glúteos."},
{id:"c6",c:"cal",w:"agi",n:"Apertura y cierre de cadera (FIFA 11+)",e:"a",q:["cuerpo"],a:[9,20],t:60,s:1,d:"Caminando o trotando, sube la rodilla y gira la pierna hacia fuera; luego hacia dentro. Alterna piernas."},
{id:"c7",c:"cal",w:"agi",n:"Desplazamientos laterales y carioca",e:"a",q:["cuerpo"],a:[9,20],t:60,s:1,d:"10 m laterales sin cruzar pies, vuelta en carioca (cruzando por delante y por detrás)."},
{id:"c8",c:"cal",w:"fue",n:"Zancadas dinámicas con giro",e:"ca",q:["cuerpo"],a:[11,20],t:60,s:1,d:"Zancada al frente y gira el tronco hacia la pierna adelantada. Rodilla alineada con el pie."},
{id:"c9",c:"cal",w:"bal",n:"Toques de activación con balón",e:"ca",q:["balon"],a:[5,20],t:60,s:1,d:"Toque-toque con el interior y pisadas suaves de suela, alternando pies. Empieza despacio y ve acelerando."},
{id:"c10",c:"cal",w:"bal",n:"Conducción suave con ambos pies",e:"a",q:["balon"],a:[8,20],t:90,s:1,d:"Conduce el balón al trote usando interior, exterior y suela de ambos pies. Levanta la mirada cada pocos toques."},
{id:"c11",c:"cal",w:"bal",n:"Lanza y controla",e:"ca",q:["balon"],a:[5,20],t:60,s:1,d:"Lánzate el balón con las manos y contrólalo con el pie, el muslo o el pecho antes de que bote dos veces."},
{id:"c12",c:"cal",w:"equ",n:"Equilibrio a una pierna (flamenco)",e:"ca",q:["cuerpo"],a:[5,20],t:60,s:1,d:"30 s sobre cada pierna, rodilla un poco flexionada. Mayores de 12: prueba con los ojos cerrados."},
{id:"c13",c:"cal",w:"equ",n:"Equilibrio con pase (FIFA 11+)",e:"ca",q:["balon"],a:[10,20],t:60,s:1,d:"Sobre una pierna, pasa el balón contra la pared con el otro pie y contrólalo sin apoyar. Cambia de pierna a los 30 s."},
{id:"c14",c:"cal",w:"equ",n:"Estatuas",e:"ca",q:["cuerpo"],a:[5,11],t:60,s:1,d:"Trota o baila y, cuando alguien dé una palmada, congélate sobre una pierna como estatua durante 5 s."},
{id:"c15",c:"cal",w:"fue",n:"Sentadilla y puente de activación",e:"ca",q:["cuerpo"],a:[8,20],t:60,s:1,d:"8 sentadillas lentas y 8 puentes de glúteo. Activa piernas y cadera antes de correr."},
{id:"c16",c:"cal",w:"fue",n:"Animales rápidos",e:"ca",q:["cuerpo"],a:[5,9],t:60,s:1,d:"15 s caminando como oso, 15 s como cangrejo, 15 s saltando como rana y 15 s como canguro."},
{id:"c17",c:"cal",w:"fue",n:"Plancha corta de activación",e:"ca",q:["cuerpo"],a:[10,20],t:45,s:1,d:"20 s de plancha frontal y 10 s de plancha lateral por cada lado. Cuerpo recto y abdomen firme."},
{id:"c18",c:"cal",w:"agi",n:"Pies rápidos y cambios de dirección",e:"ca",q:["cuerpo"],a:[5,20],t:60,s:1,d:"10 s de pies rápidos en el sitio y 3 pasos rápidos hacia un lado; repite hacia el otro lado."},
{id:"c19",c:"cal",w:"agi",n:"Reacción a la palmada",e:"ca",q:["cuerpo"],a:[5,13],t:60,s:1,d:"Trota en el sitio; a cada palmada toca el suelo, gira y vuelve a trotar lo más rápido posible."},
{id:"c20",c:"cal",w:"agi",n:"Saltitos suaves (FIFA 11+ Kids)",e:"ca",q:["cuerpo"],a:[6,20],t:45,s:1,d:"Saltos pequeños adelante-atrás y a los lados aterrizando suave, rodillas alineadas con los pies."},
// TÉCNICA
{id:"t1",c:"tec",n:"Toque-toque con el interior",e:"ca",q:["balon"],a:[5,20],t:40,s:3,d:"Pasa el balón de un pie al otro con el interior, rápido y sin mirar al balón todo el tiempo."},
{id:"t2",c:"tec",n:"Pisadas de suela alternas",e:"ca",q:["balon"],a:[5,20],t:40,s:3,d:"Toca la parte de arriba del balón con la suela, alternando pies, como si pisaras un tambor."},
{id:"t3",c:"tec",n:"Gol a la silla",e:"c",q:["balon"],a:[5,8],t:120,s:1,d:"Pon una silla de portería. Dispara con el interior entre las patas: derecha, izquierda, derecha… Cuenta tus goles."},
{id:"t4",c:"tec",n:"Conducción en zigzag",e:"a",q:["balon","conos"],a:[5,20],t:60,s:3,d:"Pon 6 conos o botellas a 1-2 m. Conduce en zigzag usando interior y exterior de ambos pies."},
{id:"t5",c:"tec",n:"Pases contra la pared",e:"ca",q:["balon"],a:[6,20],t:60,s:3,d:"A 3-5 m de una pared: pase y control con el mismo pie, luego cambia. Pase firme y raso."},
{id:"t6",c:"tec",n:"Dominadas (toques sin que caiga)",e:"ca",q:["balon"],a:[7,20],t:60,s:3,d:"Toques con el empeine, muslo y cabeza solo si tienes 12+. Si cae, vuelve a empezar y busca tu récord."},
{id:"t7",c:"tec",n:"Control orientado y giro",e:"ca",q:["balon"],a:[10,20],t:60,s:3,d:"Pase a la pared, recibe con el pie lejano orientando el cuerpo y sal en otra dirección."},
{id:"t8",c:"tec",n:"Regates: bicicleta, tijera y croqueta",e:"a",q:["balon","conos"],a:[9,20],t:45,s:4,d:"Frente a un cono, haz el regate y acelera 5 m. 1 serie por regate + 1 libre."},

function pick(list,n,r,used){
const pool=list.filter(x=>!used.has(x.id));const out=[];
while(out.length<n&&pool.length){const i=Math.floor(r()*pool.length);out.push(pool.splice(i,1)[0])}

}

function exTime(x){ // segundos planificados con descanso

const target=g.mins*60;let tot=plan.reduce((a,x)=>a+exTime(x).total,0)+exTime(by("vc")[0]||EX[0]).total;

const done=rec.done.filter(id=>rec.plan.includes(id));

}

<div class="stats"><div class="stat"><b>${wk.sessions}/${S.profile.days||g.spw}</b><span>sesiones</span></div><div class="stat"><b>${wk.mins}</b><span>minutos</span></div><div class="stat"><b>${wk.active}</b><span>días activos</span></div></div>
<div class="week">${wkDays.map((w,i)=>`<div class="d"><small>${w.s.mins||""}</small><div class="col ${w.s.mins?"":"empty"}" style="height:${Math.max(3,w.s.mins/maxM*85)}%;${w.s.session?"":"opacity:.6"}"></div><small>${DN[i]}</small></div>`).join("")}</div>
<p class="muted" style="margin:10px 0 0">${prev.mins||wk.mins?(diff>=0?`<span class="up">▲ ${diff} min</span> más que la semana pasada`:`<span class="down">▼ ${-diff} min</span> menos que la semana pasada`):"Empieza tu primera semana."}</p></div>
<div class="card"><div class="row between"><h3>Mes ${k} del semestre</h3><span class="muted">${fdate(ms.a)} – ${fdate(ms.b)}</span></div>
<div class="row between muted" style="margin-top:6px"><span>Sesiones</span><span>${ms.st.sessions}/${ms.g.sessions}</span></div>${bar(ms.st.sessions/ms.g.sessions*100)}
<div class="row between muted" style="margin-top:8px"><span>Minutos</span><span>${ms.st.mins}/${ms.g.mins}</span></div>${bar(ms.st.mins/ms.g.mins*100,"b")}
<div class="row between muted" style="margin-top:8px"><span>Pruebas físicas</span><span>${ms.tests}/${ms.g.tests}</span></div>${bar(ms.tests/ms.g.tests*100,"y")}
<p style="margin:12px 0 0;font-weight:700">${ms.ok?"🎯 ¡Meta mensual cumplida!":`Faltan ${Math.max(0,ms.g.sessions-ms.st.sessions)} sesiones y ${Math.max(0,ms.g.mins-ms.st.mins)} min · quedan ${Math.max(0,daysBetween(d,ms.b)+1)} días`}</p></div>
<div class="card"><h3>Últimas 5 semanas</h3><div class="heat" style="margin-bottom:6px">${DN.map(x=>`<div style="background:none;border:0;font-weight:700">${x}</div>`).join("")}</div><div class="heat">${heat}</div>
<p class="muted" style="font-size:12px;margin:8px 0 0">Verde intenso = sesión completa (≥70%). Amarillo = hoy.</p></div>
</div>`;
}
function viewMetas(){
const d=today(),k=monthIndex(d);
const months=[1,2,3,4,5,6].map(i=>({i,...monthStatus(i)}));
const done=months.filter(m=>m.ok).length;
const bd=badges();
const testsHtml=TESTS.filter(t=>S.profile.age>=t.min).map(t=>{
const v=(S.tests||[]).filter(x=>x.k===t.k).sort((a,b)=>a.date<b.date?-1:1);
const last=v[v.length-1],first=v[0];const imp=improved(t.k);
return `<div class="testrow"><div class="grow"><b>${t.n}</b><div class="muted" style="font-size:13px">${last?`Última: ${last.v} ${t.u} (${fdate(pd(last.date))})${v.length>1?` · inicio ${first.v} ${t.u}`:""}`:"Sin registros"}
${v.length>1?(imp>0?` <span class="up">▲ mejoró</span>`:imp<0?` <span class="down">▼</span>`:""):""}</div></div>
<button class="btn sec sm" data-test="${t.k}">Registrar</button></div>`}).join("");
return header("Metas del semestre",`${done}/6 metas mensuales cumplidas`)+
`<div class="wrap">
<div class="card"><div class="row between"><h3>Camino de 6 meses</h3><span class="pill y">${k>6?"Semestre terminado":`Mes ${k} de 6`}</span></div>
<p class="muted" style="margin-top:0">Cada mes la meta sube un poco: más sesiones y minutos, y nuevas pruebas para medir tu mejora.</p>
${months.map(m=>{const cur=m.i===k,past=m.i<k;return `<div class="month ${m.ok?"ok":""} ${cur?"now":""}"><div class="n">${m.ok?"✓":m.i}</div>
<div class="grow"><div class="row between"><b>Mes ${m.i}</b><span class="muted" style="font-size:12px">${fdate(m.a)} – ${fdate(m.b)}</span></div>
<div class="muted" style="font-size:13px">Meta: ${m.g.sessions} sesiones · ${m.g.mins} min · ${m.g.tests} prueba${m.g.tests>1?"s":""}</div>
${past||cur?`${bar(m.pct,m.ok?"":"y")}<div class="muted" style="font-size:12px;margin-top:4px">${m.st.sessions} ses · ${m.st.mins} min · ${m.tests} pruebas — ${m.ok?"cumplida":past?"no cumplida":"en curso"}</div>`:`<div class="muted" style="font-size:12px">Próximamente</div>`}</div></div>`}).join("")}
</div>
<div class="card"><h3>Pruebas físicas mensuales</h3><p class="muted" style="margin-top:0">Haz las pruebas al inicio y al final de cada mes para ver tus logros.</p>${testsHtml}</div>
<div class="card"><h3>Logros</h3><div class="badges">${bd.map(b=>`<div class="badge ${b.on?"on":""}"><span class="e">${b.e}</span>${b.n}</div>`).join("")}</div></div>
</div>`;
}
function viewPerfil(){
const p=S.profile,g=groupOf(p.age);
return header("Perfil",`${g.name}`)+
`<div class="wrap"><form class="card" id="prof">
<div class="field"><label>Nombre</label><input name="name" value="${esc(p.name)}" required maxlength="30"></div>
<div class="field"><label>Edad</label><input name="age" type="number" min="5" max="20" value="${p.age}" required></div>
<div class="field"><label>Días de entreno por semana (recomendado: ${g.spw})</label><input name="days" type="number" min="2" max="6" value="${p.days||g.spw}"></div>
<div class="field"><label>Material disponible</label>${equipChips(p.equip)}</div>
<button class="btn full" type="submit">Guardar cambios</button>
</form>
<div class="card"><h3>Recomendaciones para tu edad</h3><ul class="list-plain">${g.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>
<div class="card"><h3>Base del contenido</h3><ul class="list-plain">
<li><b>FIFA 11+ y 11+ Kids</b>: calentamiento y ejercicios de prevención de lesiones (nórdicos, Copenhague, equilibrio, saltos con buen aterrizaje).</li>
<li><b>Desarrollo del Deportista a Largo Plazo (LTAD)</b>: primero diversión y coordinación, luego técnica, después fuerza y rendimiento.</li>
<li><b>Fuerza en jóvenes (NSCA, Academia Americana de Pediatría)</b>: peso corporal en niños, bandas y cargas ligeras con técnica en adolescentes y supervisión adulta.</li>
<li><b>Guías de cabeceo (US Soccer, The FA)</b>: sin cabeceo en menores de 11 y volumen muy bajo en adelante.</li>
<li><b>OMS</b>: niños y adolescentes de 5 a 17 años necesitan una media de 60 min diarios de actividad moderada a intensa.</li>
</ul><p class="muted" style="font-size:12px">Esta app no sustituye a un entrenador ni a un médico. Si hay dolor, mareo o lesión, detén el ejercicio y consulta.</p></div>
<div class="card"><h3>Copia de seguridad</h3><p class="muted" style="margin-top:0">Tus datos viven solo en este teléfono. Copia el código para guardarlo o pasarlo a otro móvil.</p>
<div class="row"><button class="btn sec sm grow" id="bk">📋 Copiar datos</button><button class="btn sec sm grow" id="rs">📥 Restaurar</button></div>
<button class="btn warn sm full" style="margin-top:10px" id="reset">Borrar todo y empezar de nuevo</button></div>
<p class="muted" style="text-align:center;font-size:12px">Mi fútbol · versión 1.0 · gratuita</p></div>`;
}
function openModal(html){$("#sheet").innerHTML=html;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
function showInfo(id){
const x=exById(id),t=exTime(x);
openModal(`<div class="cat c-${x.c}">${CATS[x.c]}</div><h2>${esc(x.n)}</h2>${videoBox(x,200)}<p>${esc(x.d)}</p>
<div>${x.q.map(q=>`<span class="pill">${EQUIP[q]}</span>`).join("")}<span class="pill">${x.e==="ca"?"Casa y aire libre":x.e==="c"?"Casa":"Aire libre"}</span></div>
<div class="stats" style="margin:12px 0"><div class="stat"><b>${t.s}</b><span>series</span></div><div class="stat"><b>${fmt(t.t)}</b><span>por serie</span></div><div class="stat"><b>${t.rest}s</b><span>descanso</span></div></div>
${x.r?`<div class="tip">Objetivo por serie: ${x.r}</div>`:""}
<div class="row" style="margin-top:14px"><button class="btn sec grow" data-close>Cerrar</button><button class="btn grow" data-play="${x.id}">▶ Empezar</button></div>`);
}
function addExModal(){
const rec=dayRec(dk(today()),true);
const list=eligible(rec.env).filter(x=>!rec.plan.includes(x.id));
openModal(`<h2>Añadir a hoy</h2><div>${list.map(x=>`<div class="ex"><div class="grow"><div class="cat c-${x.c}">${CATS[x.c]}</div><div class="nm">${esc(x.n)}</div></div><button class="btn sm" data-add="${x.id}">＋</button></div>`).join("")||'<p class="muted">No hay más ejercicios disponibles.</p>'}</div><button class="btn sec full" style="margin-top:12px" data-close>Cerrar</button>`);
}
function testModal(k){
const t=TESTS.find(x=>x.k===k);
openModal(`<h2>${t.n}</h2><p class="muted">${{toques:"Cuenta cuántos toques seguidos logras sin que caiga el balón (mejor de 3 intentos).",plancha:"Mantén la plancha frontal con buena postura el máximo tiempo posible.",salto:"Salta con los pies juntos sin carrera previa y mide desde la línea hasta el talón más cercano (mejor de 3).",sprint:"Mide 20 m. Alguien cronometra desde tu primer movimiento hasta cruzar la meta (mejor de 2).",slalom:"6 conos a 1,5 m: ida y vuelta en zigzag conduciendo el balón."}[k]}</p>
<form id="tf"><div class="field"><label>Resultado (${t.u})</label><input name="v" type="number" step="0.01" min="0" required inputmode="decimal"></div>
<div class="row"><button type="button" class="btn sec grow" data-close>Cancelar</button><button class="btn grow" type="submit">Guardar</button></div></form>`);
$("#tf").onsubmit=e=>{e.preventDefault();const v=parseFloat(e.target.v.value);if(isNaN(v))return;
S.tests=S.tests||[];S.tests.push({k,v,date:dk(today())});save();closeModal();render();
const imp=improved(k);toast(imp>0?"📈 ¡Nueva mejora registrada!":"Prueba guardada");};
}
let P=null,actx=null;
function beep(f=880,ms=150){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.value=.15;o.start();o.stop(actx.currentTime+ms/1000)}catch(e){}
try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function startPlayer(ids){
closeModal();
const q=ids.map(id=>exById(id)).filter(Boolean);if(!q.length)return;
P={q,i:0,set:1,phase:"prep",left:5,paused:false,secs:0,timer:null};
try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
$("#ov").classList.add("show");tick(true);
P.timer=setInterval(()=>tick(false),1000);
}
function stopPlayer(){if(!P)return;clearInterval(P.timer);
const rec=dayRec(dk(today()),true);rec.secs=(rec.secs||0)+P.secs;save();P=null;$("#ov").classList.remove("show");render()}
function markDone(id){const rec=dayRec(dk(today()),true);if(!rec.plan.includes(id))rec.plan.push(id);if(!rec.done.includes(id))rec.done.push(id);save()}
function nextEx(done){
const x=P.q[P.i];if(done)markDone(x.id);
P.i++;P.set=1;
if(P.i>=P.q.length){finishPlayer();return}
P.phase="prep";P.left=8;beep(660,200);
}
function finishPlayer(){
clearInterval(P.timer);beep(990,400);
const rec=dayRec(dk(today()),true);rec.secs=(rec.secs||0)+P.secs;P.secs=0;save();
const st=recStats(rec);
$("#ov").innerHTML=`<div class="player"><div style="font-size:72px;margin-top:30px">🏆</div><h1>¡Gran trabajo, ${esc(S.profile.name)}!</h1>
<p class="muted">Hoy llevas ${st.done}/${st.total} ejercicios (${st.pct}%) y ${st.mins} minutos.</p>
${st.session?'<p class="pill acc" style="align-self:center">✓ Sesión del día completada</p>':""}
<div class="ctrls"><button class="btn full" id="pclose">Ver mi progreso</button></div></div>`;
$("#pclose").onclick=()=>{P=null;$("#ov").classList.remove("show");tab="prog";render()};
}
function tick(first){
if(!P)return;
const x=P.q[P.i],t=exTime(x);
if(!first&&!P.paused){
P.left--;if(P.phase==="work")P.secs++;
if(P.left<=3&&P.left>0)beep(520,90);
if(P.left<=0){
if(P.phase==="prep"){P.phase="work";P.left=t.t;beep(990,300)}
else if(P.phase==="work"){
if(P.set<t.s){P.phase="rest";P.left=t.rest;beep(440,300)}
else{nextEx(true);if(!P)return}
}else if(P.phase==="rest"){P.set++;P.phase="work";P.left=t.t;beep(990,300)}
}
}
if(!P||P.i>=P.q.length)return;
const cx=P.q[P.i],ct=exTime(cx);
const totalEx=P.q.length,prog=Math.round(P.i/totalEx*100);
const ph=P.paused?["p","PAUSA"]:P.phase==="prep"?["p","PREPÁRATE"]:P.phase==="work"?["w","¡A TRABAJAR!"]:["r","DESCANSO"];
$("#ov").innerHTML=`<div class="player">
<div class="row between"><span class="muted">Ejercicio ${P.i+1}/${totalEx}</span><button class="btn sec sm" id="pexit">✕ Salir</button></div>
<div style="margin:10px 0">${bar(prog)}</div>
<div class="cat c-${cx.c}" style="margin-top:14px">${CATS[cx.c]}${cx.w?" · "+WU[cx.w]:""}</div>
<h1 style="margin:6px 0 4px">${esc(cx.n)}</h1>
<div class="vid" style="margin:8px auto;width:100%;max-width:300px">${fig(cx.id,170)}</div>
<div><span class="phase ${ph[0]}">${ph[1]}</span></div>
<div class="big" style="font-size:68px;margin:4px 0">${fmt(P.left)}</div>
<div class="muted">Serie ${P.set} de ${ct.s}${cx.r?` · ${cx.r}`:""}</div>
<p style="color:var(--tx2);max-width:420px;margin:14px auto">${esc(cx.d)}</p>
${P.phase==="rest"&&P.i+1<totalEx&&P.set===ct.s?"":""}
${P.i+1<totalEx?`<div class="muted" style="font-size:13px">Siguiente: ${esc(P.q[P.i+1].n)}</div>`:""}
<div class="ctrls">
<button class="btn sec" id="pprev">⏮</button>
<button class="btn" id="ppause" style="min-width:120px">${P.paused?"▶ Seguir":"⏸ Pausa"}</button>
<button class="btn sec" id="pskip">⏭ Saltar</button>
<a class="btn sec" href="${videoURL(cx)}" target="_blank" rel="noopener">🎬 Video</a>
<button class="btn sec full" id="pdone">✓ Marcar hecho y seguir</button>
</div></div>`;
updateFigs(performance.now());
$("#pexit").onclick=stopPlayer;
$("#ppause").onclick=()=>{P.paused=!P.paused;tick(true)};
$("#pskip").onclick=()=>{nextEx(false);tick(true)};
$("#pdone").onclick=()=>{nextEx(true);tick(true)};
$("#pprev").onclick=()=>{if(P.i>0){P.i--;}P.set=1;P.phase="prep";P.left=5;tick(true)};
}
document.addEventListener("click",e=>{
const b=e.target.closest("button,[data-info]");if(!b)return;
const ds=b.dataset;
if(ds.tab){tab=ds.tab;render();return}
if(b.closest("#envseg")&&ds.env){[...b.parentNode.children].forEach(x=>x.classList.toggle("on",x===b));return}
if(b.closest("#envtoday")&&ds.env){
const rec=dayRec(dk(today()),true);if(rec.env===ds.env)return;
rec.env=ds.env;S.profile.env=ds.env;rec.plan=buildPlan(dk(today()),ds.env,rec.shuf);rec.done=rec.done.filter(id=>rec.plan.includes(id));save();render();return}
if(ds.done){const rec=dayRec(dk(today()),true);const i=rec.done.indexOf(ds.done);
if(i>=0)rec.done.splice(i,1);else{rec.done.push(ds.done);beep(880,80)}
const was=recStats(rec).session;save();render();if(recStats(rec).session&&i<0&&recStats(rec).pct>=70&&rec.done.length===Math.ceil(rec.plan.length*.7))toast("✓ ¡Sesión del día completada!");return}
if(ds.play){startPlayer([ds.play]);return}
if(ds.info&&!e.target.closest("button")){showInfo(ds.info);return}
if(ds.close!==undefined){closeModal();return}
if(ds.add){const rec=dayRec(dk(today()),true);rec.plan.splice(rec.plan.length-1,0,ds.add);save();closeModal();render();toast("Ejercicio añadido");return}
if(ds.fe){exFilter.e=ds.fe;render();return}
if(ds.fc){exFilter.c=ds.fc;render();return}
if(ds.test){testModal(ds.test);return}
switch(b.id){
case"startall":{const rec=dayRec(dk(today()),true);const pend=rec.plan.filter(id=>!rec.done.includes(id));startPlayer(pend.length?pend:rec.plan);break}
case"shuffle":{const rec=dayRec(dk(today()),true);rec.shuf=(rec.shuf||0)+1;rec.plan=buildPlan(dk(today()),rec.env,rec.shuf);
const keep=rec.done.filter(id=>!rec.plan.includes(id));rec.plan=[...keep,...rec.plan];save();render();break}
case"addex":addExModal();break;
case"bk":{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
openModal(`<h2>Copia de seguridad</h2><textarea readonly id="bkt">${code}</textarea><div class="row" style="margin-top:10px"><button class="btn sec grow" data-close>Cerrar</button><button class="btn grow" id="bkc">Copiar</button></div>`);break}
case"bkc":{const t=$("#bkt");try{navigator.clipboard.writeText(t.value).then(()=>toast("Copiado"),()=>{t.select();toast("Selecciona y copia el texto")})}catch(err){t.select();toast("Selecciona y copia el texto")}break}
case"rs":openModal(`<h2>Restaurar datos</h2><p class="muted">Pega aquí el código de la copia de seguridad.</p><textarea id="rst"></textarea><div class="row" style="margin-top:10px"><button class="btn sec grow" data-close>Cancelar</button><button class="btn grow" id="rsgo">Restaurar</button></div>`);break;
case"rsgo":{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#rst").value.trim()))));if(!o.profile)throw 0;S=o;save();closeModal();tab="hoy";render();toast("Datos restaurados")}catch(err){toast("Código no válido")}break}
case"reset":openModal(`<h2>¿Borrar todo?</h2><p class="muted">Se eliminarán el perfil, el progreso y las pruebas de este teléfono.</p><div class="row"><button class="btn sec grow" data-close>Cancelar</button><button class="btn warn grow" id="resetgo">Borrar</button></div>`);break;
case"resetgo":S=null;try{localStorage.removeItem(KEY)}catch(err){}mem=null;closeModal();render();break;
}
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("submit",e=>{
if(e.target.id==="reg"){e.preventDefault();const f=e.target;const age=parseInt(f.age.value,10);
if(!(age>=5&&age<=20)){toast("La edad debe estar entre 5 y 20 años");return}
const env=(f.querySelector("#envseg .on")||{}).dataset?.env||"c";
S={profile:{name:f.name.value.trim(),age,start:dk(today()),days:groupOf(age).spw,env,equip:[...f.querySelectorAll("[name=eq]:checked")].map(x=>x.value)},days:{},tests:[]};
save();tab="hoy";render();toast(`¡Bienvenido/a, ${S.profile.name}! Tu semestre empieza hoy`);}
if(e.target.id==="prof"){e.preventDefault();const f=e.target;const age=parseInt(f.age.value,10);
if(!(age>=5&&age<=20)){toast("La edad debe estar entre 5 y 20 años");return}
const p=S.profile;const changed=age!==p.age||JSON.stringify(p.equip)!==JSON.stringify([...f.querySelectorAll("[name=eq]:checked")].map(x=>x.value));
p.name=f.name.value.trim();p.age=age;p.days=Math.min(6,Math.max(2,parseInt(f.days.value,10)||groupOf(age).spw));
p.equip=[...f.querySelectorAll("[name=eq]:checked")].map(x=>x.value);
if(changed){const rec=S.days[dk(today())];if(rec){rec.plan=buildPlan(dk(today()),rec.env,rec.shuf);rec.done=rec.done.filter(id=>rec.plan.includes(id))}}
save();render();toast("Perfil guardado");}
});
render();
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
